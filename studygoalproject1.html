<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Goal Project</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:'Segoe UI',sans-serif;
        }
        body {
            padding:20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#064E3B,#10B981);
        }

        .container {
            background: #ecfdf5;;
            border-radius: 20px;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25) ;
        }

        h1{
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        .subtitle{
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .dashboard{
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card{
            flex: 1;
            background: #DCFCE7;
            border: 1px solid #bbf7d0;
            padding:20px;
            border-radius: 15px;
            text-align: center;
        }
        .card h3{
            color: #666;
        }

        .card p {
            color: #059669;
            font-size: 24px;
            font-weight:bold ;
            margin-top:10px;
        }
        .section{
            margin-top: 20px;
        }
        .section h2{
            margin-bottom: 10px;
            color:#333;
        }
        input{
            width:100%;
            padding:12px;
            margin-bottom: 12px;
            border: 1px solid#ddd;
            border-color: #10B981;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(16,185,129,0.3);
        }
        button{
            width:100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #10B981;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover{
            background:#059669;
        }
        .goal-container{
            background: #d1fae5
            ;
            border-radius: 20px;
            overflow: hidden;
            height: 20px;
            margin-top:10px;

        }
        .goal-bar{
            height: 100%;
            width:0%;
            background:linear-gradient(90deg,#10B981,#059669);
            transition: 0.5s;
        }
        #goalText{
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        ul{
            list-style:none;
        }
        li{
            background: #ecfdf5;;
            padding:12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .quote{
            background: #10B981;
            color: white;
            padding: 15px;
            border-left:5px solid #047857;
            margin-top:20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚Study Progress Dashboard</h1>
        <p class="subtitle">Track your academic progress daily</p>
        <div class="dashboard">
            <div class="card">
                <h3>Study Goal</h3>
                <p>10 hours</p> 
            </div>
            <div class="card">
                <h3>Total Hours</h3>
                <p id="totalHours">0</p>
            </div>
    </div>
    <div class="section">
        <h2>Add Study Session</h2>
        <form id="studyForm">
            <input type="text" id="subject" placeholder="Subject Name"required>
            <input type="number" id="hours" min="1" placeholder="Hours Studied" required>
            <button type="submit">
                Add Session
            </button>
        </form>
    </div>
    <div class="section">
        <h2>Progress</h2>
        <div class="goal-container">
            <div class="goal-bar" id="goalBar"></div>
    </div>
    <p id="goalText">0% Completed</p>
    </div>
    <div class="section">
        <h2>Recent Sessions</h2>
        <ul id="sessionList"></ul>
    </div>
    <div class="quote">
        <h3>💡Daily Motivation</h3>
        <p id="quote"></p>
        </div>
    </div>
    <script>
        const form = document.getElementById("studyForm");
        const sessionList = document.getElementById("sessionList");
        const totalHourstostudy = document.getElementById("totalHours");
        const goalBar= document.getElementById("goalBar");
        const goalText = document.getElementById("goalText");
        let totalHours=0;
        const goalHours=10;
        const quotes=["Every small step forward is a step toward greatness.","Curiosity fuels the mind; let it guide your journey.","Discipline is the bridge between dreams and achievements.","Persistence turns setbacks into setups for success.","Your potential is limitless; dare to explore it."];
        document.getElementById("quote").textContent=quotes[Math.floor(Math.random() *quotes.length)];
        form.addEventListener("submit",function(event){
            event.preventDefault();
            const subject=document.getElementById("subject").value;
            const hours=Number(document.getElementById("hours").value);
            const li=document.createElement("li");
            li.textContent= `${subject} - ${hours} Hours`;
            sessionList.appendChild(li);
            totalHours+=hours;
            totalHourstostudy.textContent=totalHours;
            let percentage=(totalHours/goalHours)*100;
            if(percentage>100){
                percentage=100;
            }
            goalBar.style.width=percentage+"%";
            goalText.textContent=percentage.toFixed(0)+"% Completed";
            if(totalHours>=goalHours){
                goalText.textContent="🌟Goal Achieved"
            }
            form.reset();
        });
    </script>
</body>
</html>
